<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <style>
        .card {
            width: 350px;
            height: 390px;
            border-radius: 10px;
             /* height: 150px; */
            background-color: rgb(14, 14, 14);
            color: white;
            margin: 50px auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .image{
            width: 300px;
            height: 200px;
            /* overflow: hidden; */
            margin: auto;
            background-size: cover;
            
        }
        .image img{
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
            transition: transform 0.6s ease;
        }
        .image:hover img {
            transform: scale(1.1);  
        }
        h3{
            margin: 20px;
        }
        p{
            margin: 30px;
        }
        span{
            font-weight: bold;
            color: greenyellow;
        }
        button{
            width: 100px;
            height: 30px;
            border: none;
            border-radius: 5px;
            background-color: teal;
            color: white;
            cursor: pointer;
            margin-top: 10px;
            margin-left: 115px;
        }
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
   

<div class="card">
    <h3>Swiggy</h3>
    <div class="image">
        <img src="https://t4.ftcdn.net/jpg/02/29/55/23/360_F_229552315_VsKpPRRFQ3BWbMA6w2LCOOqeOJWJDIWZ.jpg" alt="">
    </div>
    <p>Aaloo pratha, dahi <span>Rs.100</span></p>
    <button>Buy Now.</button>

</html>
